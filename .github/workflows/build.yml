name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: moergo-sc/zmk
          ref: main
          path: src
      - uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31.11.0
      - uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71 # v17
        with:
          name: moergo-glove80-zmk-dev
          skipPush: true
          useDaemon: false
      - name: Record build metadata
        run: |
          {
            echo "config_repository=$GITHUB_REPOSITORY"
            echo "config_sha=$GITHUB_SHA"
            echo "config_ref=$GITHUB_REF"
            echo "zmk_repository=moergo-sc/zmk"
            echo "zmk_ref=main"
            echo "zmk_sha=$(git -C src rev-parse HEAD)"
          } | tee build-metadata.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Build Glove80 combined firmware
        run: nix-build config -o combined
      - name: Copy result out of nix store
        run: cp combined/glove80.uf2 glove80.uf2
      - name: Upload result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: glove80.uf2
          path: |
            glove80.uf2
            build-metadata.txt
          retention-days: 30
